summary:
  architecture: >-
    Independent V2 verification confirms that the Ruff declaration and lock
    contradiction is repaired and one bounded Ubuntu Python 3.12 lane extends
    the quality matrix to seven jobs without changing release authority,
    runtime dependencies, public contracts, or package contents. All 31 rules,
    six critical flows, and nine Knowledge bindings are complete. The exact
    locked environment passes the full test suite and deterministic package
    checks, with zero findings.
