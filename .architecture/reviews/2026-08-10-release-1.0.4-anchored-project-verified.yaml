limitations:
  - This is V2 independent-agent verification; no human verifier participated, so it does not claim V3, V4, or V5.
  - The tag-triggered actions/attest execution cannot be exercised before publishing v1.0.4; the authorized governed release remains the end-to-end runtime proof.
  - The branch and tag GitHub quality matrices remain external evidence until their workflows finish; local macOS package and host observations are bound separately.
  - Codex CLI 0.147.0 on the recorded macOS host is the only installed-host observation; Cursor, VS Code, GitHub Copilot CLI, Kiro, and ChatGPT plugin activation remain unverified.
