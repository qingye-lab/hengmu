    focused public Skill workflows and a deterministic Python CLI, packaged
    separately for native Codex and Agent Plugins. Independent source, test,
    workflow, history, package-safety, host-evidence, and benchmark-provenance
    inspection found no evidence-backed architecture risk in the audited scope.
