problem:
  quality_attributes:
    - compatibility
    - deterministic-enforcement
    - safety
    - traceability
  constraints:
    - Preserve public Skill names, artifact schemas, CLI behavior, both package formats, and historical runtime compatibility.
    - Retain the verified two-stage release boundary in which the workflow prepares an exact six-asset draft and a local administrator performs immutable preflight and publication.
    - Require the hosted eight-lane matrix and stable Quality gate to pass before release progression.
    - Require immutable releases to be enabled and read back successfully before any publish mutation.
    - Do not add privileged workflow credentials, expand account permissions, replace published assets, or weaken quality and release gates.
  finding_ids: []
  assumptions:
    - The independently verified v1.1 implementation remains the intended release candidate while external release gates are pending.
    - GitHub remains the hosted CI and release environment for the authorized v1.1 release.
  known_facts:
    - The independent verified Review reports zero Findings across 31 Rule coverage rows, six assessed critical flows, and seven selected Knowledge entries.
    - The clean source-matched test-results Evidence Provider run at commit 0b5962857536ae0b2354dc6deab19fbb8952b9ef reports 204 passing tests and 63 passing subtests with dirty_tree and dirty_tree_after both false.
    - Local verification reports 70 percent branch coverage for resources/scripts, 91 percent changed-line coverage across resources/scripts and scripts, and zero strict mypy errors across 25 source files.
    - Both package formats were built twice with byte-identical archives, and local smoke, checksum, SPDX SBOM, and license checks passed.
    - The verified release implementation separates prepare from publish, keeps workflow permissions unchanged, and requires immutable-release readback before the local administrative publish path can mutate a draft.
  unknowns:
    - The hosted eight-lane matrix and stable Quality gate, including the authoritative Python 3.14 dependency-audit lane, have not been observed for this implementation.
    - Remote repository rulesets, Actions policy, tag protection, and immutable-release enablement and readback have not been verified for the target repository state.
    - A real draft preparation, administrative publication, exact six-asset verification, and provenance and SBOM attestation verification have not been observed for v1.1.
    - Installation, routing, and Knowledge selection smoke on the current Codex host have not been observed for the v1.1 packages.
