  slices:
    - Preserve the reviewed v1.1 implementation and its Merge Commit ancestry while moving it through pull-request review and the hosted eight-lane Quality gate.
    - Apply only the authorized remote repository controls, enable immutable releases administratively, and require successful readback without adding a workflow credential or changing account permissions.
    - Let the tag workflow prepare and validate the exact six-asset draft without publishing it.
    - Run the local administrative publish command, verify the immutable published state, exact assets, checksums, SBOMs, provenance, and attestations, then run current Codex host installation, routing, and Knowledge selection smoke.
  rollback: Before immutable publication, revert the v1.1 Merge Commit and leave any failed draft in place for diagnosis and correction; after publication, never move the tag or replace or delete immutable assets, and publish any correction as a new patch release.
  validation:
    - Validate exact Review, Decision, Knowledge selection and context, Evidence Provider, repository, project, history-anchor, and Knowledge bindings.
    - Require the hosted eight-lane matrix and stable Quality gate, including Python 3.14 dependency audit, to pass without failure or cancellation.
    - Verify authorized repository rulesets, Actions policy, tag protection, immutable-release enablement, and successful immutable GET readback.
    - Verify the exact six-asset draft, administrative publication, post-publish immutable state, checksums, SPDX SBOMs, provenance and SBOM attestations, and bounded release verification.
    - Install both v1.1 package forms on the current Codex host and record dated routing and Knowledge selection smoke evidence.
