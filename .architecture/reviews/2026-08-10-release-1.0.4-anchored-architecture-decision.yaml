problem:
  quality_attributes:
    - compatibility
    - deterministic-enforcement
    - safety
    - traceability
  constraints:
    - Preserve the local-first plugin, public Skill names, artifact schemas, and deterministic Python CLI product boundary.
    - Keep the plugin manifests, CLI version, template version, documentation, and release tag aligned.
    - Require the Selector source anchor to be reachable from the reviewed commit and to expose the same manifest version.
    - Do not publish a tag until the complete six-job hosted quality matrix passes.
    - Publish an immutable new tag and never replace the version 1.0.3 release assets.
  finding_ids: []
  assumptions:
    - Version 1.0.4 is a compatible patch release with no public runtime or artifact-schema change.
    - GitHub Actions remains the hosted publication environment after local gates pass.
  known_facts:
    - The independent V2 Review reports zero confirmed, rejected, or needs-evidence Findings across 31 rules, six critical flows, and eight selected Knowledge entries.
    - A source-matched deterministic Evidence Provider run at 538886f reports 161 passing tests.
    - Both version 1.0.4 archives were byte-identical across two independent builds, and their checksums, smoke tests, and SPDX SBOM generation passed.
    - A real Codex CLI 0.147.0 macOS installation routed the packaged plugin to hengmu:project-architecture-audit.
    - The Selector source binds commit 45c427396a7eb5fc500ed2ab4b6375720bfc310c, whose plugin manifest declares version 1.0.4.
    - The release workflow uses the verified immutable actions/attest version 4.2.2 commit pin for provenance and both package SBOM attestations.
    - Branch and tag hosted workflows remain pending external evidence until publication runs.
  unknowns:
    - The tag-triggered actions/attest version 4.2.2 execution and published attestation verification remain unobserved until the release workflow finishes.
    - Cursor, VS Code Copilot, and Kiro activation remain unverified for Hengmu 1.0.4.
