decision:
  id: ADR-HENGMU-RELEASE-1.0.4-001
  source_review: hengmu-20260810-release-1-0-4-anchored-project-verified
  source_review_sha256: ff3f5bcc3fb4ae00c3247471b0b83ec22ec927bc1de39075e74fbfe4f8dfc8ae
  decided_at: '2026-08-10T19:49:34+08:00'
  decision_makers: [architecture-owner]
  status: accepted
  supersedes: ADR-HENGMU-RELEASE-1.0.3-001
  knowledge_selection_path: .architecture/reviews/inputs/2026-08-10-release-1.0.4-anchored-decision-current-knowledge-selection.yaml
