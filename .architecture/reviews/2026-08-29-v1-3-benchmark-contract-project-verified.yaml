summary:
  architecture: >-
    Hengmu 1.3.0 extends the existing behavior benchmark rather than creating a
    second runner. The actual 38-path diff adds schema 1.6 trusted command
    envelopes, harness implementation/configuration identity, per-attempt
    status and bounded failure classes, actual-model source and fallback
    fields, retry/correction policy, Wilson intervals, failure counts, and
    tokens-per-solved. It preserves schema 1.1 through 1.5 readability and a
    byte-exact 1.0.0 Ground Truth snapshot. Context manifest 1.1 resolves exact
    case overrides before Skill defaults and rejects ambiguity. Five
    outcome-neutral fixtures cover protocol-session authority, delegated task
    ownership, sensitive GenAI traces, extension provenance/permissions, and
    unbound evaluation/model claims. Scoring re-resolves evidence and
    provenance, treats every failed trial including negatives as unsolved,
    rejects schema-valid wrong outcomes and duplicate rejected options, and
    fail-closes exact 12-attempt canary and 270-attempt matrix identity. Source
    review repairs separate the command-result schema from plugin manifests,
    seal failed execution logs, and refuse requested, aliased, missing, or
    fallback model strings as actual identity. Codex CLI 0.150.1 exposes no
    documented authoritative actual-model JSONL field, so live canary/full
    evidence and all v1.3 model-quality or release claims remain blocked. The
    version and documentation changes claim only source contract and fixture
    coverage. No public Skill/frontmatter, Knowledge entry, Rule Pack, Evidence
    Provider, release workflow, publication algorithm, or runtime network
    boundary changes occur. Independent read-only V2 verification confirms the zero-finding source
    governance assessment and its full bindings. No global test, deterministic
    Provider, live model, V4, or release evidence is claimed.
  raw_findings: 0
  confirmed: 0
  rejected: 0
