limitations:
  - This is independent read-only agent verification; no human verifier participated, so it does not claim V3, V4, or V5.
  - The hosted eight-lane matrix and stable Quality gate have not run for commit 0b5962857536ae0b2354dc6deab19fbb8952b9ef.
  - The authoritative Ubuntu Python 3.14 pip-audit lane has not run; the local standard pip-audit command failed while upgrading pip in its temporary environment, while the supplemental --disable-pip audit reported no known vulnerabilities.
  - Repository rulesets, GitHub Actions policy settings, v* tag protection, and immutable-release enablement are remote controls not verified by this Review; immutable releases are currently disabled.
  - No real v1.1 draft, publication, six-asset remote inventory, GitHub provenance attestation, or SBOM attestation has been verified.
  - The current Codex host installation, routing, and Knowledge Selection smoke has not been performed for this commit.
  - Local executable verification was performed only on macOS with Python 3.13; Python 3.11, 3.12, 3.14, Linux, and Windows remain dependent on the unrun hosted lanes.
  - The Knowledge Context sidecar was validated as an exact rendering of the Selection and is listed as evidence context; schema 1.2 trust binds the Selection itself, not a separate Context field.
