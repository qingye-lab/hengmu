limitations:
  - This is independent-agent V2 verification, not human verification or independent GitHub approval, and it does not claim V3, V4, or V5.
  - The architecture-owner reports that v1.1.1 tag run 33220607881 is red and retained draft 378815289 remains unpublished; the verifier did not independently retrieve or mutate that remote state.
  - The hosted eight-lane v1.1.2 matrix, stable Quality gate, tag workflow, and draft preparation have not run for commit 80f20dd9e8bc9a44858d27db92f458af40d6cea7; local configuration and tests do not prove GitHub scheduler or API behavior.
  - No real v1.1.2 draft, exact six-asset remote inventory, GitHub provenance attestation, SBOM attestation, immutable publication, or post-publication verification has been observed.
  - Repository rulesets, GitHub Actions policy settings, v* tag protection, and the remote immutable-releases setting remain unverified by this local audit.
  - The clean provider ran only on macOS arm64 with Python 3.13; other supported hosted operating-system and Python lanes remain unverified.
  - The current Codex host installation, routing, and Knowledge Selection smoke has not been performed for v1.1.2.
  - The repository has one maintainer and no independent GitHub approval identity; this independent-agent V2 verification must not be represented as human review or independent GitHub approval.
  - At verifier completion, the nine Phase A governance files were uncommitted; this Verified artifact does not convert them into committed or hosted evidence.
  - The audit Knowledge Context was validated as an exact rendering of the fresh Selection and is listed as evidence context; schema 1.2 trust binds the Selection itself, not a separate Context field.
