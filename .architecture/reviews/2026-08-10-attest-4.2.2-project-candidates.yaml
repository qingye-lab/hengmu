summary:
  architecture: >-
    Hengmu 1.0.3 remains a local, distributable architecture-governance plugin
    with focused Skill workflows and a deterministic Python CLI. This patch
    changes only the immutable actions/attest pin used after deterministic
    archive, checksum, license, and SPDX generation. Release permissions,
    triggers, attestation subjects, SBOM paths, manifests, runtime files, and
    public contracts are unchanged.
  raw_findings: 0
  confirmed: 0
  rejected: 0
  needs_evidence: 0
