problem:
  quality_attributes:
    - compatibility
    - deterministic-enforcement
    - safety
    - traceability
  constraints:
    - Preserve the local-first plugin and deterministic Python CLI as the product boundary.
    - Preserve public Skill names and artifact schemas while correcting unsafe or ambiguous execution paths.
    - Reject unsafe archive entries before platform-specific path normalization.
    - Do not publish a tag until the complete supported OS and Python quality matrix passes.
    - Keep host and model claims bounded to dated, reproducible evidence.
  finding_ids: []
  assumptions:
    - Version 1.0.3 remains a compatible patch release for the existing public plugin surface.
    - GitHub Actions remains the hosted publication environment after local gates pass.
  known_facts:
    - The independent V2 Review reports zero confirmed, rejected, or needs-evidence Findings across 31 rules and six critical flows.
    - A source-matched deterministic Evidence Provider run at 059f36e reports 161 passing tests.
    - Version 1.0.2 was published even though Windows Python 3.11 and 3.13 CI rejected the backslash archive test.
    - The 1.0.3 implementation rejects raw backslashes and Windows drive forms before extraction and tests both package formats.
    - The tag release job now depends on the complete six-job Linux, macOS, and Windows quality matrix.
    - Dated host evidence proves one Codex CLI 0.147.0 macOS installation and routed project audit without claiming other hosts.
    - Two identified models completed 60 accepted behavior trials with immutable source, context, fixture, command, and log bindings.
  unknowns:
    - Hosted GitHub CI and tag publication remain external evidence until the branch and tag workflows finish.
    - Cursor, VS Code Copilot, and Kiro activation remain unverified for Hengmu 1.0.3.
