options:
  - id: keep-current
    title: Keep the local-first architecture and harden release integrity
    complexity_tier: keep-current
    architecture_styles: []
    patterns: []
    technologies: []
    benefits:
      - Repairs the demonstrated Windows archive and publication dependency gaps at their owning boundaries.
      - Preserves public Skills, artifact schemas, local execution, and both package projections.
      - Adds current host and behavior evidence without broad compatibility claims.
    liabilities:
      - Each future host and model claim still requires its own dated evidence.
      - Maintainers must preserve the full-matrix release dependency as workflows evolve.
    assumptions:
      - A compatible patch can add stricter unsafe-input rejection and unique per-run evidence paths.
    quality_attribute_effects:
      - {attribute: compatibility, effect: improves, rationale: Public identities remain stable while platform-specific archive ambiguity is rejected consistently.}
      - {attribute: deterministic-enforcement, effect: improves, rationale: Publication waits for every supported matrix job and revalidates both archives.}
      - {attribute: safety, effect: improves, rationale: Unsafe raw archive names are rejected before operating-system normalization.}
      - {attribute: traceability, effect: improves, rationale: 'Per-run inputs, host observations, benchmark runs, checksums, SBOMs, and attestations bind release evidence.'}
    business_fit: Delivers the smallest compatible correction to an already published open-source plugin.
    team_fit: Uses the existing Python, GitHub Actions, Skill, schema, and evidence boundaries owned by the maintainers.
    evolution_fit: Leaves host adapters and internal module boundaries conditional on measured evidence.
    implementation_complexity: low
    operational_complexity: low
    migration_risk: low
    reversibility: easy
    cost: low
    technical_maturity: mature
    lock_in: none
    tradeoff_scores: {business_fit: 2, quality_fit: 2, team_fit: 2, implementation: 2, operations: 2, migration: 2, reversibility: 2, cost: 2, maturity: 2, lock_in: 2, evolution: 2}
    rejected_reasons: []
  - id: defer-public-contract-changes
    title: Defer the 1.0.3 public-contract corrections
    complexity_tier: low
    architecture_styles: []
    patterns: []
    technologies: []
    benefits:
      - Avoids changing manifests, Skill procedures, templates, and release workflows immediately.
    liabilities:
      - Leaves the demonstrated Windows archive invariant and release publication race unresolved.
      - Retains fixed-name audit inputs that can collide across consecutive runs.
    assumptions:
      - A later release can safely absorb the correction despite a published failing matrix.
    quality_attribute_effects:
      - {attribute: compatibility, effect: degrades, rationale: Windows and repeated-run behavior remain inconsistent with the documented contract.}
      - {attribute: deterministic-enforcement, effect: degrades, rationale: A tag can still publish before the complete quality matrix succeeds.}
      - {attribute: safety, effect: degrades, rationale: Raw archive names remain dependent on platform normalization behavior.}
      - {attribute: traceability, effect: degrades, rationale: Fixed-name inputs and premature publication leave ambiguous run and release ancestry.}
    business_fit: Avoids short-term change but leaves a released defect and weakens maintainer trust.
    team_fit: Requires repeated manual release checking and future rework.
    evolution_fit: Delays rather than removes the same bounded correction.
    implementation_complexity: low
    operational_complexity: medium
    migration_risk: medium
    reversibility: easy
    cost: medium
    technical_maturity: mature
    lock_in: low
    tradeoff_scores: {business_fit: -1, quality_fit: -2, team_fit: -1, implementation: 2, operations: -1, migration: 0, reversibility: 2, cost: 0, maturity: 2, lock_in: 1, evolution: -1}
    rejected_reasons:
      - It preserves two directly observed release-integrity failures instead of repairing them.
  - id: add-host-adapters-now
    title: Add lifecycle adapters for every named host now
    complexity_tier: high
    architecture_styles: []
    patterns: []
    technologies: []
    benefits:
      - Could provide host-specific installation and lifecycle behavior if each host later proves it necessary.
    liabilities:
      - Adds unverified host APIs, lifecycle states, permissions, maintenance, and test obligations.
      - Expands scope beyond the observed Codex CLI route and the portable archive contract.
    assumptions:
      - Every named host requires a custom adapter for a public Hengmu outcome.
    quality_attribute_effects:
      - {attribute: compatibility, effect: unknown, rationale: No failing named-host activation path currently proves an adapter requirement.}
      - {attribute: deterministic-enforcement, effect: degrades, rationale: Additional unowned host-specific release paths increase the verification surface.}
      - {attribute: safety, effect: degrades, rationale: New host permissions and lifecycle hooks would lack current evidence and accountable controls.}
      - {attribute: traceability, effect: degrades, rationale: Multiple unobserved adapters add provenance paths that cannot yet be verified.}
    business_fit: Unsupported by current adoption or failing-host evidence.
    team_fit: Creates multi-host maintenance without accountable host owners or test environments.
    evolution_fit: Prematurely commits to lifecycle seams that should follow measured incompatibility.
    implementation_complexity: high
    operational_complexity: high
    migration_risk: high
    reversibility: difficult
    cost: high
    technical_maturity: unknown
    lock_in: high
    tradeoff_scores: {business_fit: -2, quality_fit: -1, team_fit: -2, implementation: -2, operations: -2, migration: -2, reversibility: -1, cost: -2, maturity: -1, lock_in: -2, evolution: -1}
    rejected_reasons:
      - No verified host failure or accountable owner justifies the additional lifecycle boundaries.
selected_option: keep-current
rationale: >-
  The accepted scope is the smallest compatible correction to demonstrated
  release-integrity failures. It preserves Hengmu's local-first architecture and
  public contracts while fixing unsafe cross-platform archive handling, release
  dependency ordering, consecutive-run evidence identity, and current-version
  evidence. Deferral leaves observed failures unresolved, while broad host
  adapters add unsupported authority and maintenance boundaries.
revisit_triggers:
  - A named host supplies a reproducible failure for a public Hengmu outcome that the portable contract cannot satisfy.
  - A verified finding shows that per-run evidence or the full-matrix release dependency does not preserve source authority.
  - Measured contributor or change coupling justifies an internal module-boundary decision.
acceptance_evidence:
  - The repository owner explicitly approved execution of the complete v1.0.3 release-integrity plan on 2026-08-09.
  - The architecture-owner role accepts the bounded public-contract changes and retains the existing local-first product boundary.
  - The accepted decision is bound to the independent V2 Review, which reports zero unresolved Findings and complete Rule Pack and critical-flow coverage.
migration:
  affected_paths:
    - .codex-plugin/plugin.json
    - plugin.json
    - resources/scripts/architecture_tool.py
    - resources/templates/knowledge-selection.yaml
    - skills/ai-agent-architecture-audit/SKILL.md
    - skills/architecture-solution-advisor/references/decision-artifact-workflow.md
    - skills/mobile-architecture-audit/SKILL.md
    - .github/workflows/ci.yml
    - .github/workflows/release.yml
    - scripts/smoke_test_package.py
    - tests/test_package_plugin.py
  slices:
    - Reject raw unsafe ZIP entry names before extraction and protect the invariant with platform-independent tests.
    - Make tag publication depend on the complete supported quality matrix and smoke-test both archive formats.
    - Give specialist audit and solution inputs unique run identities while preserving explicit missing-Profile advisory behavior.
    - Bind dated Codex host evidence and two-model behavior evidence without extending claims to unavailable hosts or workflows.
  rollback: Revert the 1.0.3 compatibility changes as one patch while retaining the published 1.0.2 artifacts and their checksums; do not publish the 1.0.3 tag.
  validation:
    - Validate the exact Review, Decision, Knowledge selection, evidence, and Gate bindings.
    - Pass repository, profile, history, Knowledge, 161-test, lint, formatting, dependency, license, package, checksum, SBOM, and smoke checks.
    - Require the hosted six-job quality matrix before tag publication and verify both published attestations afterward.
