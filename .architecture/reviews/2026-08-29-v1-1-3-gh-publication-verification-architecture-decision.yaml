options:
  - id: keep-current
    title: Keep the verified v1.1.3 stable gh 2.93.0 publication preflight
    complexity_tier: keep-current
    architecture_styles: [style.plugin-architecture]
    patterns: []
    technologies: []
    benefits:
      - Preserves the smallest verified correction and all public, packaging, exact-asset, attestation, credential, and immutable publication boundaries.
      - Rejects every unclassified or unsupported local GitHub CLI state before any publication remote call while retaining local-asset precedence.
      - Accepts GitHub's patched 2.93.0 minimum without forcing maintainers to install a newer version than the verified contract requires.
      - Leaves hosted v1.1.3, real publication, and current-host compatibility as blocking external evidence gates.
    liabilities:
      - Publication remains blocked on hosts whose GitHub CLI is older, missing, prerelease, or does not emit the stable first-line format.
      - Real 2.93.0 execution remains unobserved until a release operator exercises that exact boundary or a newer supported stable CLI.
    assumptions:
      - External release gates can validate the reviewed commit without another source or contract change.
    quality_attribute_effects:
      - {attribute: compatibility, effect: improves, rationale: 'The published minimum supports the patched GitHub CLI boundary without needlessly requiring 2.98.0.'}
      - {attribute: deterministic-enforcement, effect: improves, rationale: 'One anchored parser and tuple comparison classify the supported stable CLI before all remote publication calls.'}
      - {attribute: safety, effect: improves, rationale: 'Missing and unclassified CLI states fail before immutable administration, Release reads, publication, or verification.'}
      - {attribute: traceability, effect: improves, rationale: 'Source, selector, tests, Provider, Candidate, V2 verification, Decision, and later release outcomes remain separately bound.'}
    business_fit: Completes the authorized patch using the lowest supported stable GitHub CLI boundary while keeping external proof mandatory.
    team_fit: Uses the existing single-maintainer local administrator flow without adding credentials, permissions, or a second publication client.
    evolution_fit: Keeps the version floor explicit and independently changeable through a later tested patch if GitHub changes its CLI contract.
    implementation_complexity: low
    operational_complexity: low
    migration_risk: low
    reversibility: easy
    cost: low
    technical_maturity: mature
    lock_in: low
    tradeoff_scores: {business_fit: 2, quality_fit: 2, team_fit: 2, implementation: 2, operations: 2, migration: 2, reversibility: 2, cost: 2, maturity: 2, lock_in: 1, evolution: 2}
    rejected_reasons: []
  - id: raise-floor-to-2-98
    title: Require GitHub CLI 2.98.0 for publication
    complexity_tier: low
    architecture_styles: [style.plugin-architecture]
    patterns: []
    technologies: []
    benefits:
      - Matches the newer stable GitHub CLI output exercised on the local release host.
      - Avoids relying on an unexercised exact 2.93.0 binary during the first v1.1.3 publication.
    liabilities:
      - Rejects stable GitHub CLI versions from 2.93.0 through 2.97.x despite the declared patched minimum and identical required command surface.
      - Creates avoidable operator upgrade work without evidence that the higher floor protects another invariant.
    assumptions:
      - Local observation of 2.98.0 is more important than compatibility with the supported patched range.
    quality_attribute_effects:
      - {attribute: compatibility, effect: degrades, rationale: 'It narrows the supported administrator environment beyond the evidenced minimum.'}
      - {attribute: deterministic-enforcement, effect: neutral, rationale: 'The same parser and ordering remain; only the comparison tuple increases.'}
      - {attribute: safety, effect: neutral, rationale: 'No additional unsafe version class is proven between 2.93.0 and 2.98.0.'}
      - {attribute: traceability, effect: neutral, rationale: 'The higher number adds no new provenance or evidence binding.'}
    business_fit: Adds operator friction without a demonstrated release-safety gain.
    team_fit: Requires unnecessary host upgrades for the single maintainer and recovery environments.
    evolution_fit: Couples the patch to one locally observed current version instead of the supported capability boundary.
    implementation_complexity: low
    operational_complexity: medium
    migration_risk: medium
    reversibility: easy
    cost: medium
    technical_maturity: mature
    lock_in: medium
    tradeoff_scores: {business_fit: -1, quality_fit: 0, team_fit: -1, implementation: 2, operations: 0, migration: 0, reversibility: 2, cost: 0, maturity: 2, lock_in: 0, evolution: -1}
    rejected_reasons:
      - No verified invariant requires excluding stable GitHub CLI versions that meet the 2.93.0 patched minimum.
  - id: direct-attestation-api
    title: Replace GitHub CLI verification with custom direct Release and attestation API calls
    complexity_tier: high
    architecture_styles: [style.plugin-architecture]
    patterns: []
    technologies: []
    benefits:
      - Could remove the local GitHub CLI version dependency.
      - Could expose every HTTP request and response under a project-owned client.
    liabilities:
      - Requires new authentication, pagination, attestation, signature, retry, error-classification, and API-version ownership inside Hengmu.
      - Duplicates the existing GitHub CLI release and attestation surface and broadens credential-handling and long-term compatibility obligations.
      - Would require new security, provider, integration, and real-host evidence rather than addressing the bounded local version defect.
    assumptions:
      - Owning a custom GitHub API and attestation client is safer and cheaper than validating the supported GitHub CLI.
    quality_attribute_effects:
      - {attribute: compatibility, effect: degrades, rationale: 'A new private API client adds GitHub REST and attestation compatibility duties beyond the existing CLI contract.'}
      - {attribute: deterministic-enforcement, effect: degrades, rationale: 'More response, pagination, authentication, and retry states would require classification and tests.'}
      - {attribute: safety, effect: degrades, rationale: 'Credential and publication logic would expand into new project-owned code without a demonstrated need.'}
      - {attribute: traceability, effect: neutral, rationale: 'Direct calls could be logged, but no new provenance property is established over the current verified CLI path.'}
    business_fit: Solves a bounded CLI compatibility check by creating a larger release subsystem.
    team_fit: Adds substantial security and maintenance ownership to a single-maintainer project.
    evolution_fit: Increases lock-in to unstable API and attestation details that the GitHub CLI currently owns.
    implementation_complexity: high
    operational_complexity: high
    migration_risk: high
    reversibility: difficult
    cost: high
    technical_maturity: unknown
    lock_in: high
    tradeoff_scores: {business_fit: -2, quality_fit: -2, team_fit: -2, implementation: -2, operations: -2, migration: -2, reversibility: -2, cost: -2, maturity: -2, lock_in: -2, evolution: -2}
    rejected_reasons:
      - It replaces a verified bounded preflight with an unevidenced credentialed subsystem and materially expands scope.
selected_option: keep-current
rationale: >-
  The independently verified connector-normalized v1.1.3 patch has zero Findings and is the smallest
  compatible correction to the local publication-client uncertainty. Keeping
  the 2.93.0 floor preserves the declared patched minimum, accepts the exercised
  current-style 2.98.0 output, and fails every unsupported state before remote
  publication access. Raising the floor excludes supported stable clients
  without another protected invariant; a custom direct API and attestation
  client creates new credential, compatibility, and operational ownership far
  beyond the observed defect. All hosted, remote, publication, and host-smoke
  results remain blocking external gates.
revisit_triggers:
  - GitHub changes the stable first-line `gh version` format or documents a newer minimum for required immutable Release or attestation commands.
  - A stable GitHub CLI at or above 2.93.0 fails the preflight or required publication command on a supported administrator host.
  - Any hosted v1.1.3 matrix lane, Quality gate, tag workflow, exact draft, attestation, immutable publication, or bounded verification fails.
  - Remote immutable-release readback is disabled, missing, malformed, or cannot satisfy the administrator publication preflight.
  - Current Codex host installation, routing, CLI, or Knowledge Selection smoke exposes a public compatibility defect.
acceptance_evidence:
  - The architecture-owner accepts the connector-normalized source and selector identities as the authoritative tree-equivalent v1.1.3 chain; the independent-agent V2 result is not represented as independent GitHub approval identity separation.
  - The architecture-owner explicitly authorized the v1.1.3 governed verification and accepted the three-option comparison without expanding credentials, permissions, remote mutation, public contracts, or implementation scope.
  - The architecture-owner selects keep-current and requires hosted, draft, attestation, immutable-publication, post-verification, and current-host gates before release completion.
  - The Decision binds the independent V2 Verified Review with zero Findings and the clean test-results Provider recording 216 passing tests and 89 passing subtests in JUnit 305 at commit 6193ea0c5cb8e0f0c145c65f514522b1074372ec.
migration:
  affected_paths:
    - .codex-plugin/plugin.json
    - CHANGELOG.md
    - README.md
    - README.zh-CN.md
    - docs/compatibility-evidence/2026-08-29-hengmu-1.1.2.md
