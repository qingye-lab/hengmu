problem:
  quality_attributes:
    - compatibility
    - deterministic-enforcement
    - safety
    - traceability
  constraints:
    - Retain the independently verified v1.1.3 GitHub CLI publication preflight and source ancestry without changing the exact-six asset, permission, attestation, or public runtime contracts.
    - Enumerate local expected assets before checking the CLI, then require a stable first-line GitHub CLI version at or above the supported floor before every remote publication call.
    - Keep prepare draft-only and preserve the separately authorized immutable administrator publication boundary, published read-only behavior, and bounded verification.
    - Require hosted matrix, Quality gate, v1.1.3 tag, draft, attestations, immutable publication, and current-host smoke before release completion.
    - Do not add privileged workflow credentials, expand permissions, move immutable tags, replace published assets, or weaken failure behavior.
    - Keep public Skills, Rule Packs, Knowledge entries, schemas, release assets, package boundaries, and historical artifact readability unchanged.
  finding_ids: []
  assumptions:
    - The verified source and selector-anchor commits remain the intended v1.1.3 patch while external release gates are pending.
    - GitHub remains the authorized hosted CI, draft, attestation, and immutable Release environment.
  known_facts:
    - The independent remote-normalized V2 Verified Review reports zero Findings across 31 Rule rows, six assessed critical flows, seven audit Knowledge entries, 21 changed files, 26 unique source bindings, and 23 bound paths.
    - Connector normalization changed commit metadata and identities while preserving the reviewed source tree; trusted bindings use only source 6c4e983e5df769634fa60effebe12e7557e9b1ac and selector anchor 6193ea0c5cb8e0f0c145c65f514522b1074372ec.
    - The clean test-results Evidence Provider at commit 6193ea0c5cb8e0f0c145c65f514522b1074372ec records 216 passing tests and 89 passing subtests in JUnit 305 with dirty_tree and dirty_tree_after both false.
    - Publication enumerates the six local assets, then parses only the first `gh version` line using the anchored stable X.Y.Z contract before immutable GET, Release lookup, publish, or verification.
    - Missing executable, nonzero, empty, malformed, prerelease, and versions below 2.93.0 fail with an actionable upgrade message and zero publication remote calls.
    - GitHub CLI 2.93.0 and current-style 2.98.0 outputs are accepted by deterministic tests; 2.75.0 is rejected, while real 2.93.0 was not exercised on the verifier host.
    - Prepare remains limited to the exact six assets and cannot publish; immutable administration, exact inventory, published read-only behavior, and five-attempt verification remain unchanged.
    - Native and portable manifests, tool, benchmark default, template, documentation, and selector metadata identify v1.1.3 while selector source remains bound to implementation commit 6c4e983e5df769634fa60effebe12e7557e9b1ac.
    - Repository evidence records v1.1.2 as immutable published with dated Codex host evidence; the V2 verifier did not independently query or mutate that remote or host state.
  unknowns:
    - The hosted eight-lane matrix, stable Quality gate, and real v1.1.3 tag workflow have not been observed for the reviewed commit.
    - Remote repository rulesets, Actions policy, v* tag protection, immutable-release enablement, and immutable readback remain unverified for v1.1.3.
    - A real v1.1.3 exact six-asset draft, provenance and SPDX attestations, immutable publication, and post-publication verification have not been observed.
    - Installation, routing, CLI, and Knowledge Selection smoke on the current Codex host have not been observed for v1.1.3 packages.
