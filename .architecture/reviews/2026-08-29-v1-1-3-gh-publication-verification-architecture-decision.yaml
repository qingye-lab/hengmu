    - docs/roadmap.md
    - plugin.json
    - resources/scripts/architecture_tool.py
    - resources/selector-source.json
    - resources/templates/knowledge-selection.yaml
    - scripts/publish_release.py
    - scripts/run_behavior_benchmark.py
    - tests/test_architecture_tool.py
    - tests/test_constrained_target_architecture.py
    - tests/test_package_plugin.py
    - tests/test_release_publication.py
    - tests/test_repository_contract.py
    - tests/test_supply_chain.py
  slices:
    - Preserve source commit 6c4e983e5df769634fa60effebe12e7557e9b1ac and selector-anchor commit 6193ea0c5cb8e0f0c145c65f514522b1074372ec as distinct ancestry, open a pull request, and merge with a Merge Commit only after required review and checks pass.
    - Create an annotated v1.1.3 tag on the merged source and require the real hosted eight-lane matrix, stable Quality gate, and tag-triggered reusable workflow to complete successfully.
    - Verify the reusable workflow prepares the exact six-asset v1.1.3 draft and produces valid archive provenance plus both SPDX SBOM attestations without publishing.
    - From a separately authorized administrator environment, confirm a supported stable GitHub CLI, immutable-release enablement, exact draft inventory, one-time publication, immutable readback, and bounded Release and asset verification.
    - Install both v1.1.3 package forms on the current Codex host and record dated discovery, routing, CLI, and Knowledge Selection smoke evidence.
  rollback: Before immutable v1.1.3 publication, revert the recovery Merge Commit or issue a later corrective patch without moving or deleting the immutable v1.1.2 tag or replacing its assets. Retain every failed workflow, draft, and attestation artifact for diagnosis. After publication, never move the v1.1.3 tag or replace or delete immutable assets; publish any correction as a new patch release.
  validation:
    - Validate the exact Candidate and Verified Reviews, accepted Decision, both Knowledge selections and contexts, clean Evidence Provider run, source bindings, repository, project, history anchors, and Knowledge catalogs.
    - Require focused and full tests, strict mypy, branch and changed-line coverage, Ruff check and format, license and dependency audit, deterministic double build, extracted package smoke, checksum, SPDX SBOM, and archive-boundary verification.
    - Require the hosted eight-lane v1.1.3 matrix and stable Quality gate, including the Python 3.14 dependency-audit lane, to pass without failure, cancellation, or unexpected skip.
    - Verify authorized repository rulesets, Actions policy, v* tag protection, immutable-release enablement, and successful immutable GET readback without adding privileged hosted credentials.
    - Verify the real v1.1.3 tag run, exact six-asset draft, provenance and SBOM attestations, administrator publication, post-publish immutable state, checksums, and bounded remote verification.
    - Install both v1.1.3 package forms on the current Codex host and record dated installation, routing, CLI, and Knowledge Selection smoke evidence.
