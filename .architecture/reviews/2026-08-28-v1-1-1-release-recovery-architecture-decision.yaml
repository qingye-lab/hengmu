problem:
  quality_attributes:
    - compatibility
    - deterministic-enforcement
    - safety
    - traceability
  constraints:
    - Retain the independently verified v1.1.1 release-recovery patch and its source ancestry without broadening its release or runtime scope.
    - Require the hosted eight-lane matrix, stable Quality gate, and real v1.1.1 tag run to pass before draft progression.
    - Preserve the exact six-asset prepare-only hosted workflow and separately authorized local immutable publication boundary.
    - Never move or republish v1.1.0, and never add privileged hosted credentials or expand workflow permissions.
    - Keep public Skills, Rule Packs, Knowledge entries, schemas, release assets, package boundaries, and historical artifact behavior unchanged.
  finding_ids: []
  assumptions:
    - The independently verified source commit remains the intended v1.1.1 recovery candidate while external release gates are pending.
    - GitHub remains the authorized hosted CI, draft, attestation, and immutable Release environment.
  known_facts:
    - The independent verified Review reports zero Findings across 31 Rule coverage rows, six assessed critical flows, and seven audit Knowledge entries.
    - The clean source-matched test-results Evidence Provider at commit db27b78a5de7502e294078aec603c0c8b9de10a5 records 207 passing tests and 67 passing subtests with dirty_tree and dirty_tree_after both false.
    - The reviewed CI source requires a non-cancelled workflow, a successful stable Quality gate, and a v-prefixed tag before the reusable prepare-only release workflow is eligible.
    - Local contract tests cover successful tag eligibility plus failed, cancelled, skipped, branch, and non-v-tag counterexamples, while real hosted scheduling remains unobserved.
    - Native and portable manifests, selector metadata, Knowledge Selection template, and benchmark defaults identify v1.1.1 without changing the Rule Pack or Knowledge-entry versions.
    - The existing release workflow and publication implementation retain the prepare-only hosted phase, exact six-asset inventory, immutable readback, separately authorized publish, and bounded verification behavior.
  unknowns:
    - The hosted eight-lane matrix, stable Quality gate, and real v1.1.1 tag workflow have not been observed for the reviewed commit.
    - Remote repository rulesets, Actions policy, v* tag protection, and immutable-release enablement and readback have not been verified for this release attempt.
    - A real v1.1.1 draft, exact six-asset remote inventory, provenance and SBOM attestations, immutable publication, and post-publication verification have not been observed.
    - Installation, routing, and Knowledge Selection smoke on the current Codex host have not been observed for the v1.1.1 packages.
