limitations:
  - This is independent-agent V2 verification, not human V3, V4, V5, or independent GitHub approval.
  - The hosted eight-lane v1.1.3 matrix, stable Quality gate, tag workflow, draft preparation, attestations, immutable publication, and post-publication verification have not run for commit 6193ea0c5cb8e0f0c145c65f514522b1074372ec.
  - Repository rulesets, GitHub Actions policy settings, v* tag protection, and current remote immutable-release enablement were not queried by the verifier.
  - The clean provider ran only on macOS arm64 with Python 3.13; other supported hosted operating-system and Python lanes remain unverified.
  - GitHub CLI 2.93.0 is the enforced boundary but was not exercised on the verifier host; deterministic tests cover the boundary, current-style 2.98.0, malformed, prerelease, nonzero, empty, and missing-executable paths.
  - The v1.1.2 Release and Codex host observations remain repository-recorded architecture-owner evidence; the verifier did not independently query or mutate GitHub, installed plugins, rollback state, or user configuration.
  - No current Codex installation, routing, or Knowledge Selection smoke has been performed for a built v1.1.3 package.
  - The repository has one maintainer; this V2 agent separation must not be represented as independent GitHub approval identity separation.
  - At verification time the four fresh inputs, four provider files, and Candidate were untracked; the Verified artifact does not convert them into committed or hosted evidence.
  - Connector normalization changed commit metadata and identities while preserving the reviewed source tree; this Verified Review trusts only source 6c4e983e5df769634fa60effebe12e7557e9b1ac and selector anchor 6193ea0c5cb8e0f0c145c65f514522b1074372ec, not the prior local comparison IDs.
  - The audit Knowledge Context is an exact Selection projection; schema 1.2 trust binds the Selection itself rather than a separate Context field.
