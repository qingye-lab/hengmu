summary:
  architecture: >-
    Hengmu 1.2.0 is a bounded Knowledge and deterministic-selection expansion.
    The actual 29-path base-to-anchor diff adds six schema-valid Standard
    Knowledge entries for MCP, A2A, Agent Skills, OpenTelemetry GenAI, agent
    evaluation design, and secure agent-tool execution; registers them in the
    211-entry content-version 2.1.0 tree; adds positive, negative, cross-entry,
    budget, advisor-policy, and freshness-boundary tests; repairs the fixed-date
    tests exposed by the first canonical test run; and aligns public version and
    package identity to 1.2.0. MCP and OpenTelemetry GenAI use 45-day review
    windows; the other four use 90 days. Each entry binds official standards or
    maintainer snapshots and, where appropriate, primary research while making
    its protocol, snapshot, maturity, authority, privacy, and non-applicability
    boundaries explicit. No selector algorithm, SKILL_REQUIRED policy, schema,
    Rule Pack, Evidence Provider, public Skill, benchmark behavior, release
    workflow, or publication algorithm changes occur. A distinct clean Provider
    passes all current tests; hosted and independent verification are not
    claimed.
  raw_findings: 0
  confirmed: 0
  rejected: 0
  needs_evidence: 0
