limitations:
  - This is a candidate Review only; no independent finding verification has occurred, so it does not claim V2, V3, V4, or V5.
  - The hosted eight-lane v1.2.0 matrix, stable Quality gate, tag workflow, draft preparation, attestations, immutable publication, post-publication verification, and current-host package smoke have not run for commit 5c4723385b1dd651f45b1d5268da1843e75f6dea.
  - The clean passed Provider ran only on macOS arm64 with Python 3.13; other supported operating-system and Python lanes remain unverified.
  - >-
    The preserved failed run test-results-20260829t074706168606z-b36be491ff59
    is causal negative evidence only: it exposed four obsolete fixed-date
    fixtures after the new 2026-08-29 entries. It is not passed tool evidence;
    the corrected distinct clean run passes the full suite.
