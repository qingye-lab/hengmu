schema_version: '1.2'
decision:
  id: ADR-HENGMU-V1.1.2-DRAFT-LOOKUP-001
  source_review: hengmu-20260829-v1-1-2-remote-draft-lookup-project-verified
  source_review_sha256: a5c6cac63711f0be4a7ed55db77d4e87a77292edc6b8d213f86e7e7cac286c30
  decided_at: '2026-08-29T01:45:00Z'
  decision_makers: [architecture-owner]
  status: accepted
  supersedes: ADR-HENGMU-V1.1.1-RELEASE-RECOVERY-001
  knowledge_selection_path: .architecture/reviews/inputs/2026-08-29-v1-1-2-remote-draft-lookup-decision-knowledge-selection.yaml
  knowledge_selection_sha256: 7a19cc8c8c35a696a98cdf471939a03b03354c8eab28a787e83ca0e231ba4d65
problem:
  quality_attributes:
    - compatibility
    - deterministic-enforcement
    - safety
    - traceability
  constraints:
    - Retain the independently verified v1.1.2 authenticated Release state-discovery repair and its source ancestry without broadening public runtime, asset, or permission contracts.
    - Preserve the published-by-tag fast path, HTTP-404-only exhaustive exact-tag fallback, and identity-checked numeric Release ID authority read.
    - Preserve the exact six-asset prepare-only hosted workflow and separately authorized immutable administrator publication boundary.
    - Require the hosted eight-lane matrix, stable Quality gate, real v1.1.2 tag run, exact draft, attestations, immutable publication, post-verification, and current-host smoke before release completion.
    - Never publish, delete, move, or rebuild the red-run v1.1.1 tag or retained draft, and never add privileged hosted credentials or expand workflow permissions.
    - Keep public Skills, Rule Packs, Knowledge entries, schemas, release assets, package boundaries, and historical artifact behavior unchanged.
  finding_ids: []
  assumptions:
    - The independently verified remote source and selector-anchor commits remain the intended v1.1.2 recovery candidate while external release gates are pending.
    - GitHub remains the authorized hosted CI, draft, attestation, and immutable Release environment.
  known_facts:
    - The independent V2 Verified Review reports zero Findings across 31 Rule coverage rows, six assessed critical flows, seven audit Knowledge entries, and 25 unique source anchors.
    - The clean source-matched test-results Evidence Provider at commit 80f20dd9e8bc9a44858d27db92f458af40d6cea7 records 214 passing tests and 79 passing subtests in JUnit 293 with dirty_tree and dirty_tree_after both false.
    - Remote source tree 9605a679ee2d26f0db063c2d8487d4430e5d1311 is byte-identical to the independently verified local implementation tree.
    - The verified implementation keeps the published-by-tag endpoint as a tag-checked fast path and enters complete authenticated page enumeration only after HTTP 404.
    - The fallback accepts one exact tag match, rejects malformed or duplicate identity, and re-reads draft, immutable, and asset state through the matched numeric Release ID.
    - Prepare remains limited to the exact six assets and cannot publish; publication remains a separately authorized local administrator phase guarded by immutable-release readback and post-publish verification.
    - Native and portable manifests, selector metadata, Knowledge Selection template, benchmark default, documentation, and tests identify v1.1.2 without changing Rule Pack or Knowledge-entry versions.
    - The architecture-owner reports v1.1.1 tag run 33220607881 red and draft 378815289 retained unpublished; local implementation and V2 verification did not retrieve or mutate that remote state.
  unknowns:
    - The hosted eight-lane matrix, stable Quality gate, and real v1.1.2 tag workflow have not been observed for the reviewed commit.
    - Remote repository rulesets, Actions policy, v* tag protection, immutable-release enablement, and immutable readback remain unverified for v1.1.2.
    - A real v1.1.2 exact six-asset draft, provenance and SBOM attestations, immutable publication, and post-publication verification have not been observed.
    - Installation, routing, CLI, and Knowledge Selection smoke on the current Codex host have not been observed for v1.1.2 packages.
    - The architecture-owner-observed v1.1.1 failed run and retained draft have not been independently re-read by the verifier.
knowledge_snapshot:
  - {id: domain.plugin-platform, version: 1.0.0, sha256: b72a0e3b6959464b32c9a4d44b50baa40b4baf13b5b14f65f99d094f301bf58c}
