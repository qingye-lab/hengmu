  slices:
    - No remediation source migration is authorized or required; preserve implementation commit 417f3c9586c7a0b35f1e7838ae6ae646c4702e0b, selector anchor 5c4723385b1dd651f45b1d5268da1843e75f6dea, and the Candidate, V2 Verified Review, Decision Selection/Context, accepted Decision, passed Provider, and causal failed Evidence as distinct bound ancestry.
    - Commit the complete governance chain only after its hashes, current-runtime selections, contexts, source bindings, Decision, repository, project, history, change, and release gates validate; merge the governed branch with a Merge Commit rather than squash or rebase.
    - Require the hosted eight-lane Python 3.11 through 3.14 matrix and stable Quality gate, then build both package formats twice, compare bytes, run extracted smoke, verify checksums, licenses, and SPDX SBOMs.
    - Create an annotated v1.2.0 tag only after V4 release evidence is complete; require exact-six draft preparation, archive provenance and SBOM attestations, separately authorized immutable publication, readback, and bounded post-publication verification.
    - Install both v1.2.0 package forms on the current Codex host and record dated discovery, routing, CLI, six-topic Knowledge Selection/Context, and negative-selection smoke evidence.
  rollback: Before immutable v1.2.0 publication, revert the governed Merge Commit or issue a later corrective patch without rewriting history, moving the immutable v1.1.3 tag, or replacing its assets. Retain every failed workflow, Provider, draft, and attestation artifact for diagnosis. After publication, never move the v1.2.0 tag or replace or delete immutable assets; publish any correction as a new patch release.
  validation:
    - Validate the exact Candidate and Verified Reviews, accepted Decision, both audit and Decision Knowledge selections and contexts, passed Provider, causal failed Evidence identity, source bindings, repository, project, history anchors, and Knowledge catalogs.
    - Require focused and full tests, strict mypy, runtime branch and changed-line coverage, Ruff check and format, dependency and license audit, deterministic double build, extracted package smoke, checksum, SPDX SBOM, and archive-boundary verification.
    - Require the hosted eight-lane v1.2.0 matrix and stable Quality gate, including the Python 3.14 dependency-audit lane, to pass without failure, cancellation, or unexpected skip.
    - Verify repository rulesets, Actions policy, v* tag protection, immutable-release enablement, exact draft inventory, and successful immutable GET readback without adding privileged hosted credentials.
    - Verify the real v1.2.0 tag run, exact six-asset draft, provenance and SBOM attestations, administrator publication, immutable state, checksums, and bounded remote verification.
    - Install both v1.2.0 package forms on the current Codex host and record dated installation, routing, CLI, and Knowledge Selection/Context smoke evidence.
