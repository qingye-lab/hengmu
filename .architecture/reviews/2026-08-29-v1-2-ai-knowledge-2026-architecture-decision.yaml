problem:
  quality_attributes:
    - compatibility
    - deterministic-enforcement
    - maintainability
    - reproducibility
    - safety
    - traceability
  constraints:
    - Accept only the independently verified six-entry Knowledge and deterministic selection coverage expansion at reviewed commit 5c4723385b1dd651f45b1d5268da1843e75f6dea.
    - Limit v1.2 claims to Knowledge content and deterministic selection coverage; do not claim improved model behavior, benchmark quality, production fitness, security certification, or protocol conformance.
    - Keep MCP and OpenTelemetry GenAI on 45-day review windows and A2A, Agent Skills, agent evaluation design, and secure agent-tool runtime on 90-day review windows.
    - Preserve official or maintainer-snapshot source bindings, primary-research support where declared, Standard curation maturity, and explicit non-applicability, authority, privacy, version, and freshness boundaries.
    - Do not add SKILL_REQUIRED behavior or change the selector algorithm, public Skills/frontmatter, schemas, Rule Packs, Evidence Providers, release workflow, publication algorithm, benchmark schemas, cases, scoring, or runtime behavior.
    - Preserve the source commit and selector-anchor ancestry and require hosted, packaging, immutable-release, attestation, and current-host gates before v1.2 release completion.
    - Preserve the failed fixed-date Evidence Run as causal negative evidence only; never treat it as passed tool evidence or rewrite its status.
  finding_ids: []
  assumptions:
    - The independently verified source commit and selector anchor remain the intended v1.2 implementation while external release gates are pending.
    - GitHub remains the authorized hosted CI, draft, attestation, and immutable Release environment without adding privileged workflow credentials.
  known_facts:
    - The V2 Verified Review at raw SHA d52f67e4107dd658b8ed9fbb1c7cc83c34d41b1d056ffe6d47cdf5215835692b and canonical SHA 3011e97b73a27650ffe1789e24b10df6a78497030c72205e959690295d6ca4b0 reports zero Findings across 31 Rule rows, six critical flows, fourteen audit Knowledge entries, and all 29 changed paths at commit 5c4723385b1dd651f45b1d5268da1843e75f6dea.
    - The clean passed test-results Evidence Provider at reviewed commit 5c4723385b1dd651f45b1d5268da1843e75f6dea records 222 passing tests and 106 passing subtests in JUnit 328 with dirty_tree and dirty_tree_after both false.
    - Six schema-valid Standard Knowledge entries bind official standards or maintainer snapshots and, for evaluation and secure runtime guidance, declared primary research; MCP and OTel GenAI use 45-day review windows while the other four use 90 days.
    - The ten-pack Markdown Knowledge tree contains 211 entries at content version 2.1.0, and deterministic tests cover exact positive triggers, generic and negated exclusions, cross-protocol isolation, kind-budget accounting, advisor policy, and first-stale-day boundaries.
    - Native and portable manifests, CLI, benchmark default, Selection template, user documentation, and selector metadata align to public version 1.2.0 while selector source is anchored to implementation commit 417f3c9586c7a0b35f1e7838ae6ae646c4702e0b.
    - The preserved failed run test-results-20260829t074706168606z-b36be491ff59 recorded four deterministic failures caused by obsolete explicit test dates; the current source corrects those fixtures and a distinct clean run passes the complete suite.
    - The 29-path diff does not modify public Skills, schemas, Rule Packs, Evidence Provider definitions, GitHub workflows, release publication code, benchmark schemas, benchmark cases, or benchmark scoring.
    - Decision Selection uses the project-stable control-plane facts/profile required by Decision schema 1.2 validation; the accepted implementation snapshot is separately and exactly bound by the Verified Review raw hash and reviewed commit.
  unknowns:
    - The hosted eight-lane v1.2.0 matrix, stable Quality gate, real tag workflow, exact-six draft, provenance and SPDX attestations, immutable publication, and post-publication verification have not been observed for the reviewed commit.
    - Current-host installation, routing, CLI, and Knowledge Selection smoke have not been observed for built v1.2.0 packages.
    - Remote repository rulesets, Actions policy, v* tag protection, immutable-release enablement, and administrator readback remain unverified for v1.2.
    - No model-behavior evaluation was performed for v1.2, so model precision, recall, stability, decision accuracy, and production behavior remain unknown and outside this release claim.
    - Upstream protocol, specification, semantic-convention, security-guidance, and research availability can change after the bound review dates and requires the declared freshness review.
