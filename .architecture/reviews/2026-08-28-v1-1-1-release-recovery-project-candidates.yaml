limitations:
  - This is a candidate Review only; no independent finding verification has occurred, so it does not claim V3, V4, or V5.
  - The hosted eight-lane v1.1.1 tag workflow and stable Quality gate have not run for commit db27b78a5de7502e294078aec603c0c8b9de10a5; local configuration and tests do not prove GitHub scheduler behavior.
  - Hengmu v1.1.0 was tagged but remains unpublished; this Review neither moves that tag nor treats it as a successful Release.
  - No real v1.1.1 draft, six-asset remote inventory, GitHub provenance attestation, SBOM attestation, immutable publication, or post-publication verification has been observed.
  - Repository rulesets, GitHub Actions policy settings, v* tag protection, and the remote immutable-releases setting remain unverified by this local audit.
  - The current Codex host installation, routing, and Knowledge Selection smoke has not been performed for v1.1.1.
  - The audit Knowledge Context was validated as an exact rendering of the fresh Selection and is listed as evidence context; schema 1.2 trust binds the Selection itself, not a separate Context field.
