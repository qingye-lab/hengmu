summary:
  architecture: >-
    Hengmu 1.1.1 is a narrowly scoped release-recovery patch for the local,
    distributable architecture-governance plugin. The local CI definition now
    makes the tag draft job eligible only when the workflow is not cancelled,
    the stable Quality gate succeeds, and the ref is a v-prefixed tag; its
    truth-table tests cover failed, cancelled, skipped, branch, and non-v-tag
    counterexamples. Native and portable manifests, selector metadata, template,
    benchmark default, documentation, and tests align on 1.1.1 while the public
    Skill, Rule Pack, Knowledge, release asset, permission, and two-stage immutable
    publication contracts remain unchanged. Deterministic local evidence passes;
    the real hosted tag path and remote release controls remain unverified.
  raw_findings: 0
  confirmed: 0
  rejected: 0
  needs_evidence: 0
