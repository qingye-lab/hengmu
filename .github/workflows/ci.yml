name: CI

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    name: Plan quality matrix
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      docs_only: ${{ steps.plan.outputs.docs_only }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Select matrix and detect documentation-only changes
        id: plan
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: >-
          python3 scripts/ci_plan.py
          --event "${{ github.event_name }}"
          --base "${PR_BASE_SHA}"
          --head "${PR_HEAD_SHA}"

  quality:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    needs: plan
    if: needs.plan.outputs.docs_only != 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Archived benchmark verification resolves evidence at earlier commits.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install locked development dependencies
        run: >-
          python -m pip install --require-hashes
          --requirement requirements-dev.lock

      - name: Validate repository contracts
        run: python scripts/validate_repository.py

      - name: Validate dogfood architecture profile
        run: python resources/scripts/architecture_tool.py validate-project .

      - name: Validate governance history anchors
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.13'
        run: python resources/scripts/architecture_tool.py validate-history-anchors .

      - name: Validate architecture knowledge
        run: python resources/scripts/validate_knowledge.py

      - name: Run tests with branch coverage
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.13'
        run: >-
          python -m pytest
          --cov
          --cov-branch
          --cov-report=term-missing:skip-covered
          --cov-report=xml

      - name: Enforce runtime branch coverage
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.13'
        run: >-
          python -m coverage report
          --include="resources/scripts/*"
          --fail-under=68.0

      - name: Run tests
        if: matrix.os != 'ubuntu-latest' || matrix.python-version != '3.13'
        run: python -m pytest

      - name: Enforce pull request changed-line coverage
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.13'
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: python scripts/check_changed_coverage.py

      - name: Run strict type checking
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.13'
        run: python -m mypy resources/scripts scripts

      - name: Run layered architecture change gate
        shell: bash
        env:
          BASE_COMMIT: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          gate_args=(--project . --stage change)
          if [[ "${BASE_COMMIT}" =~ ^[0-9a-fA-F]{40}$ ]] && \
            [[ "${BASE_COMMIT}" != "0000000000000000000000000000000000000000" ]]; then
            gate_args+=(--base-commit "${BASE_COMMIT}")
          fi
          python resources/scripts/architecture_tool.py gate "${gate_args[@]}"

      - name: Lint
        run: python -m ruff check .

      - name: Check formatting
        run: python -m ruff format --check .

      - name: Audit runtime dependencies
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.14'
        run: python -m pip_audit --requirement requirements-runtime.lock

      - name: Audit runtime dependency licenses
        run: python scripts/audit_licenses.py

      - name: Build deterministic Codex plugin archive
        run: python scripts/package_plugin.py --format codex --output-dir dist

      - name: Build deterministic Agent Plugins archive
        run: >-
          python scripts/package_plugin.py
          --format agent-plugins
          --output-dir dist

      - name: Smoke test Codex archive
        run: >-
          python scripts/smoke_test_package.py
          --format codex
          --archive "dist/hengmu-*.zip"

      - name: Smoke test Agent Plugins archive
        run: >-
          python scripts/smoke_test_package.py
          --format agent-plugins
          --archive "dist/hengmu-*-agent-plugins.zip"

      - name: Verify archive checksum
        shell: bash
        run: python scripts/verify_checksum.py dist/*.zip.sha256

      - name: Generate SPDX SBOM
        shell: bash
        run: >-
          python scripts/generate_sbom.py
          --archive dist/*.zip
          --output-dir dist

  dependency-review:
    name: Dependency and license review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          deny-licenses: GPL-3.0, AGPL-3.0

  quality-gate:
    name: Quality gate
    if: always()
    needs:
      - plan
      - quality
      - dependency-review
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Require event-specific quality results
        run: >-
          python scripts/evaluate_ci_gate.py
          --event "${{ github.event_name }}"
          --quality "${{ needs.quality.result }}"
          --dependency-review "${{ needs.dependency-review.result }}"
          ${{ needs.plan.outputs.docs_only == 'true' && '--docs-only' || '' }}

  release:
    name: Prepare verified tag draft
    if: ${{ !cancelled() && needs.quality-gate.result == 'success' && startsWith(github.ref, 'refs/tags/v') }}
    needs:
      - quality-gate
    permissions:
      attestations: write
      contents: write
      id-token: write
    uses: ./.github/workflows/release.yml
