name: Deploy website to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - "index.html"
      - "robots.txt"
      - "sitemap.xml"
      - "site/**"
      - "assets/hengmu-readme-illustrations/**"
      - "docs/assets/brand/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Build static artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p \
            _site/site \
            _site/assets/hengmu-readme-illustrations/en \
            _site/assets/hengmu-readme-illustrations/zh-CN \
            _site/docs/assets/brand/en \
            _site/docs/assets/brand/zh-CN
          cp index.html robots.txt sitemap.xml _site/
          cp -R site/. _site/site/
          cp assets/hengmu-readme-illustrations/en/*.png \
            _site/assets/hengmu-readme-illustrations/en/
          cp assets/hengmu-readme-illustrations/zh-CN/*.png \
            _site/assets/hengmu-readme-illustrations/zh-CN/
          cp docs/assets/brand/qingye-wordmark-blue.svg _site/docs/assets/brand/
          cp docs/assets/brand/en/hengmu-icon.svg \
            docs/assets/brand/en/hengmu-banner.png \
            _site/docs/assets/brand/en/
          cp docs/assets/brand/zh-CN/hengmu-icon.svg \
            docs/assets/brand/zh-CN/hengmu-banner.png \
            _site/docs/assets/brand/zh-CN/
          touch _site/.nojekyll
          test -s _site/index.html
          test -s _site/site/i18n.json
          if find _site -type l -print -quit | grep -q .; then
            echo "GitHub Pages artifact must not contain symlinks" >&2
            exit 1
          fi

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
