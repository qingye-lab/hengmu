[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["."]
relative_files = true
omit = ["*/hengmu-package-smoke-*/*"]
patch = ["subprocess"]

[tool.coverage.report]
include = ["resources/scripts/*", "scripts/*"]
show_missing = true
skip_covered = true

[tool.coverage.xml]
output = "coverage.xml"

[tool.mypy]
python_version = "3.11"
strict = true
files = ["resources/scripts", "scripts"]

[tool.ruff]
target-version = "py311"
line-length = 88
extend-exclude = ["dist"]

[tool.ruff.lint]
select = ["B", "C4", "E", "F", "I", "PTH", "RUF", "SIM", "UP"]

[tool.ruff.lint.per-file-ignores]
"scripts/curate_golden_knowledge.py" = ["E501"]

[tool.ruff.format]
indent-style = "space"
line-ending = "lf"
quote-style = "double"
